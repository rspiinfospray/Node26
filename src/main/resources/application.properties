spring.application.name=peon-simulator
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/peons;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=illuvatar
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.infospray.peonsimulator.*
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
server.port=${SERVER_PORT:8080}
simulator.kafka.enabled=${KAFKA_ENABLED:false}
simulator.clock.delay-ms=${SIMULATION_DELAY_MS:600}
logging.level.org.apache.kafka=WARN

# Valeurs par défaut du monde
simulator.game.world-width=50
simulator.game.world-height=50
simulator.game.rock-percentage=20
simulator.game.tree-percentage=15
simulator.game.food-cell-percentage=15
simulator.game.min-food-per-cell=1
simulator.game.max-food-per-cell=3
simulator.game.max-rounds=100

# Valeurs par défaut des peons
simulator.game.initial-health-points=100
simulator.game.max-health-points=100
simulator.game.initial-experience-points=0
simulator.game.experience-per-level=100
simulator.game.hunger-health-loss-per-turn=5

# Effets des actions
simulator.game.eat-health-gain=40
simulator.game.eat-experience-gain=20
simulator.game.move-experience-gain=5
simulator.game.move-health-cost=5
simulator.game.attack-experience-gain=40
simulator.game.lethal-attack-experience-gain=60
simulator.game.attack-damage=20
simulator.game.attack-damage-gain-per-level=10
simulator.game.max-health-gain-per-level=10
simulator.game.tree-health-points=100
simulator.game.wood-per-chop=25
simulator.game.wood-required-for-house=200
simulator.game.chop-wood-experience-gain=20
simulator.game.build-house-experience-gain=70
simulator.game.house-hunger-percentage=50

# Seuils du moteur de décision
simulator.game.eat-health-threshold=90
simulator.game.attack-minimum-health=35
simulator.game.enemy-flee-health-threshold=45
simulator.game.enemy-pursuit-health-threshold=70
simulator.game.seek-food-health-threshold=70
simulator.game.communication-frequency=4

# Apprentissage et IA utilitaire
simulator.game.learning-rate=0.20
simulator.game.exploration-percentage=10
simulator.game.exploration-maximum-score-gap=20
simulator.game.critical-health-exploration-threshold=20
simulator.game.action-history-limit=100

# Interface
simulator.game.default-zoom-percent=170
